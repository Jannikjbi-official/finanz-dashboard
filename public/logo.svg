<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Finanzen">
  <defs>
    <linearGradient id="finanzenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="9" fill="url(#finanzenBg)" />

  <!-- Aufsteigende Balken: der Verlauf, um den es in der App geht -->
  <rect x="7" y="18" width="4.5" height="7" rx="2.25" fill="#ffffff" opacity="0.55" />
  <rect x="13.75" y="14" width="4.5" height="11" rx="2.25" fill="#ffffff" opacity="0.78" />
  <rect x="20.5" y="9" width="4.5" height="16" rx="2.25" fill="#ffffff" />

  <!-- Der gruene Punkt steht fuer das, was uebrig bleibt -->
  <circle cx="22.75" cy="6.25" r="2.75" fill="#22c55e" stroke="url(#finanzenBg)" stroke-width="1.5" />
</svg>
